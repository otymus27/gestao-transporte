services:
    # ===========================
    # Backend - Spring Boot
    # ===========================
    api:
        build: ./backend
        container_name: api-transporte
        restart: unless-stopped  # Reinicia sempre, exceto se você parar o container
        env_file:
            - .env
        environment:
            - TZ=America/Sao_Paulo  # ✅ Define o fuso no sistema do container
        ports:
          - "8084:8080"
        networks:
            - otymus_net

  # ===========================
    # Frontend - Angular + Nginx
    # ===========================
    frontend:
        build: ./frontend
        container_name: frontend-transporte
        restart: unless-stopped  # Reinicia sempre, exceto se você parar o container
        environment:
            - TZ=America/Sao_Paulo # ✅ Evita que o Nginx registre logs em UTC
        ports:
            - "85:80"
        depends_on:
            - api
        networks:
            - otymus_net


# ===========================
# Volumes (persistência)
# ===========================
volumes:
  mysql_volume:

# ===========================
# Redes
# ===========================
networks:
    otymus_net:
        external: true


