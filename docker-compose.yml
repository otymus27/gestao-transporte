services:
    # ===========================
    # Banco de Dados - MySql
    # ===========================
#    mysql:
#      image: mysql:8.0
#      container_name: mysql_nutran
#      environment:
#        MYSQL_DATABASE: db_nutran
#        MYSQL_ROOT_PASSWORD: root
#      ports:
#        - "3306:3306"
#      volumes:
#        - mysql_volume:/var/lib/mysql
#      networks: [ otymus_net ]
#      healthcheck:
#        test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot" ]
#        interval: 5s
#        timeout: 3s
#        retries: 30

    # ===========================
    # Backend - Spring Boot
    # ===========================
    api:
        build: ./backend
        container_name: api-transporte
        env_file:
            - .env
        depends_on:
          mysql:
            condition: service_healthy
        ports:
          - "8084:8080"
        networks:
            - otymus_net
        # Politica de reinicio:
        restart: always # Sempre reinicia, mesmo se voce parar manualmente (ate o 'down')
        # restart: on-failure # So reinicia se o container sair com codigo de erro (diferente de zero)
        # restart: unless-stopped # Reinicia sempre, exceto se vocÃª explicitamente der 'stop'
        # restart: no # Padrao: nunca reinicia

  # ===========================
    # Frontend - Angular + Nginx
    # ===========================
    frontend:
        build: ./frontend
        container_name: frontend-transporte
        ports:
            - "85:80"
        depends_on:
            - api
        networks:
            - otymus_net
      # Politica de reinicio:
        restart: always # Sempre reinicia, mesmo se voce parar manualmente (ate o 'down')
      # restart: on-failure # So reinicia se o container sair com codigo de erro (diferente de zero)
      # restart: unless-stopped # Reinicia sempre, exceto se vocÃª explicitamente der 'stop'
      # restart: no # Padrao: nunca reinicia

# ===========================
# Volumes (persistência)
# ===========================
volumes:
  mysql_volume:

# ===========================
# Redes
# ===========================
networks:
    otymus_net:
        external: true


