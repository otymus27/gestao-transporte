<div class="container mt-2 mw-100">
  <div class="card shadow-sm">
    <div class="card-body">
      <div
        class="d-flex justify-content-between align-items-center bg-dark text-white p-3 rounded mb-3"
      >
        <h3 class="m-0">Relatório de Setores</h3>
      </div>

      <!-- Filtros -->
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <input
            type="text"
            class="form-control"
            placeholder="Filtrar por Nome"
            [(ngModel)]="filtros.nome"
          />
        </div>

        <div class="col-sm-3 d-flex gap-2">
          <button class="btn btn-primary flex-grow-1" (click)="consultar()">
            <i class="bi bi-search"></i> Consultar
          </button>
          <button class="btn btn-outline-secondary" (click)="limpar()">
            <i class="bi bi-x-circle"></i>
          </button>
        </div>
      </div>

      <!-- Exportação -->
      <div
        *ngIf="resultados.length > 0"
        class="d-flex justify-content-st gap-2 mb-2"
      >
        <button class="btn btn-danger btn-sm" (click)="exportar('pdf')">
          <i class="bi bi-file-earmark-pdf"></i> PDF
        </button>
        <button class="btn btn-success btn-sm" (click)="exportar('excel')">
          <i class="bi bi-file-earmark-excel"></i> Excel
        </button>
        <button class="btn btn-secondary btn-sm" (click)="exportar('csv')">
          <i class="bi bi-file-earmark-text"></i> CSV
        </button>
      </div>

      <!-- Tabela de resultados -->
      <div *ngIf="resultados.length > 0; else semResultados">
        <table class="table table-hover table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nome</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let s of resultados">
              <td>{{ s.id }}</td>
              <td>{{ s.nome }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Paginação -->
      <div
        *ngIf="resultados.length > 0"
        class="d-flex justify-content-between align-items-center mt-2"
      >
        <div class="text-muted">
          Total: <b>{{ totalElements }}</b> registros
        </div>

        <div class="d-flex align-items-center gap-2">
          <label class="text-muted mb-0">Por página:</label>
          <select
            class="form-select form-select-sm"
            style="width: 90px"
            (change)="mudarTamanho($event)"
          >
            <option [selected]="size === 5" value="5">5</option>
            <option [selected]="size === 10" value="10">10</option>
            <option [selected]="size === 20" value="20">20</option>
            <option [selected]="size === 50" value="50">50</option>
          </select>

          <button
            class="btn btn-outline-secondary btn-sm"
            (click)="irPara(0)"
            [disabled]="page === 0"
          >
            «
          </button>
          <button
            class="btn btn-outline-secondary btn-sm"
            (click)="irPara(page - 1)"
            [disabled]="page === 0"
          >
            ‹
          </button>

          <span class="text-muted">
            Página <b>{{ page + 1 }}</b> de <b>{{ totalPages }}</b>
          </span>

          <button
            class="btn btn-outline-secondary btn-sm"
            (click)="irPara(page + 1)"
            [disabled]="page >= totalPages - 1"
          >
            ›
          </button>
          <button
            class="btn btn-outline-secondary btn-sm"
            (click)="irPara(totalPages - 1)"
            [disabled]="page >= totalPages - 1"
          >
            »
          </button>
        </div>
      </div>

      <!-- Mensagens -->
      <ng-template #semResultados>
        <div class="text-center text-muted mt-4" *ngIf="!carregando">
          Nenhum resultado encontrado.
        </div>
      </ng-template>

      <div class="text-center mt-3" *ngIf="carregando">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Carregando...</span>
        </div>
      </div>
    </div>
  </div>
</div>
