<header class="app-header">
  <div class="header-left">
    <button class="btn-toggle" (click)="toggleSidebar()">
      <i class="bi bi-list"></i>
    </button>
    <div class="header-brand">
      <img src="/ses_logo.png" alt="Logo" class="brand-logo" />
      <span class="brand-name">Gestão de Transporte - NUTRAN</span>
    </div>
  </div>

  <div class="header-right">
    <div class="user-badge">
      <div class="user-avatar">
        <i class="bi bi-person-fill"></i>
      </div>
      <div class="user-info">
        <span class="user-name">{{ loggedInFirstName }}</span>
        <span class="user-role">{{ loggedInMainRole }}</span>
      </div>
    </div>
    <button class="btn-logout" (click)="logout()">
      <i class="bi bi-box-arrow-right me-1"></i> Sair
    </button>
  </div>
</header>
