<div class="sidebar" [class.active]="isCollapsed">
  <ul class="nav flex-column">
    <!-- Dashboard -->
    <li class="nav-item">
      <a
        class="nav-link"
        routerLink="/admin/dashboard"
        routerLinkActive="active"
      >
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
      </a>
    </li>

    <div class="nav-group-label">Cadastros</div>

    <!-- Usuários -->
    <li class="nav-item" *ngIf="isAdmin()">
      <a
        class="nav-link"
        routerLink="/admin/usuarios/gerenciar"
        routerLinkActive="active"
      >
        <i class="bi bi-people-fill"></i>
        <span>Usuários</span>
      </a>
    </li>

    <!-- Setores -->
    <li class="nav-item" *ngIf="isAdmin() || isGerente() || isSupervisor()">
      <a
        class="nav-link"
        routerLink="/admin/setores/gerenciar"
        routerLinkActive="active"
      >
        <i class="bi bi-building"></i>
        <span>Setores</span>
      </a>
    </li>

    <!-- Destinos -->
    <li class="nav-item" *ngIf="isAdmin() || isGerente() || isSupervisor()">
      <a
        class="nav-link"
        routerLink="/admin/destinos/gerenciar"
        routerLinkActive="active"
      >
        <i class="bi bi-geo-alt-fill"></i>
        <span>Destinos</span>
      </a>
    </li>

    <!-- Motoristas -->
    <li class="nav-item" *ngIf="isAdmin() || isGerente() || isSupervisor()">
      <a
        class="nav-link"
        routerLink="/admin/motoristas/gerenciar"
        routerLinkActive="active"
      >
        <i class="bi bi-person-vcard"></i>
        <span>Motoristas</span>
      </a>
    </li>

    <!-- Carros -->
    <li class="nav-item" *ngIf="isAdmin() || isGerente() || isSupervisor()">
      <a
        class="nav-link"
        routerLink="/admin/carros/gerenciar"
        routerLinkActive="active"
      >
        <i class="bi bi-car-front-fill"></i>
        <span>Carros</span>
      </a>
    </li>

    <div class="nav-group-label">Operações</div>

    <!-- Solicitações -->
    <li class="nav-item" *ngIf="isAdmin() || isGerente() || isSupervisor() || isBasic()">
      <a
        class="nav-link"
        routerLink="/admin/solicitacoes/gerenciar"
        routerLinkActive="active"
      >
        <i class="bi bi-journal-text"></i>
        <span>Solicitações</span>
      </a>
    </li>

    <!-- Fichas -->
    <li class="nav-item" *ngIf="isAdmin() || isGerente() || isSupervisor() || isBasic()">
      <a
        class="nav-link"
        routerLink="/admin/fichas/gerenciar"
        routerLinkActive="active"
      >
        <i class="bi bi-journal-bookmark-fill"></i>
        <span>Fichas</span>
      </a>
    </li>

    <!-- Relatórios -->
    <li class="nav-item" *ngIf="isAdmin() || isGerente() || isSupervisor()">
      <a
        class="nav-link"
        routerLink="/admin/relatorios/geral"
        routerLinkActive="active"
      >
        <i class="bi bi-file-earmark-bar-graph"></i>
        <span>Relatórios</span>
      </a>
    </li>

    <div class="nav-group-label">Conta</div>

    <!-- Alterar Senha -->
    <li class="nav-item" *ngIf="isLogado()">
      <a
        class="nav-link"
        routerLink="/admin/perfil/alterar-senha"
        routerLinkActive="active"
      >
        <i class="bi bi-key"></i>
        <span>Alterar Senha</span>
      </a>
    </li>

    <!-- Sobre -->
    <li class="nav-item" *ngIf="isLogado()">
      <a class="nav-link" routerLink="/admin/sobre" routerLinkActive="active">
        <i class="bi bi-info-circle"></i>
        <span>Sobre</span>
      </a>
    </li>
  </ul>
</div>
