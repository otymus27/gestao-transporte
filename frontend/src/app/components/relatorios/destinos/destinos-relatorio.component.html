<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <div
        class="d-flex justify-content-between align-items-center bg-dark text-white p-3 rounded mb-3"
      >
        <h3 class="m-0">Relatório de Destinos</h3>
      </div>

      <!-- Filtros -->
      <div class="row g-2 mb-3">
        <div class="col-md-8">
          <input
            type="text"
            class="form-control"
            placeholder="Filtrar por nome do destino"
            [(ngModel)]="filtros.nome"
          />
        </div>

        <div class="col-md-4 d-flex gap-2">
          <button class="btn btn-primary flex-grow-1" (click)="consultar()">
            <i class="bi bi-search"></i> Consultar
          </button>
          <button class="btn btn-outline-secondary" (click)="limpar()">
            <i class="bi bi-x-circle"></i>
          </button>
        </div>
      </div>

      <!-- Exportação -->
      <div
        *ngIf="resultados.length > 0"
        class="d-flex justify-content-end gap-2 mb-2"
      >
        <button class="btn btn-danger btn-sm" (click)="exportar('pdf')">
          <i class="bi bi-file-earmark-pdf"></i> PDF
        </button>
        <button class="btn btn-success btn-sm" (click)="exportar('excel')">
          <i class="bi bi-file-earmark-excel"></i> Excel
        </button>
        <button class="btn btn-secondary btn-sm" (click)="exportar('csv')">
          <i class="bi bi-file-earmark-text"></i> CSV
        </button>
      </div>

      <!-- Resultados -->
      <div *ngIf="resultados.length > 0; else semResultados">
        <table class="table table-hover table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nome</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let destino of resultados">
              <td>{{ destino.id }}</td>
              <td>{{ destino.nome }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Mensagens -->
      <ng-template #semResultados>
        <div class="text-center text-muted mt-4" *ngIf="!carregando">
          Nenhum resultado encontrado.
        </div>
      </ng-template>

      <div class="text-center mt-3" *ngIf="carregando">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Carregando...</span>
        </div>
      </div>
    </div>
  </div>
</div>
