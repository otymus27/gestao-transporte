user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;

        client_max_body_size 50M;   # ✅ limite máximo do tamanho do arquivo para fazer upload

        server_name _;  # Aceita qualquer nome de host

        root /usr/share/nginx/html;
        index index.html index.htm;

        location / {
           
            try_files $uri $uri/ /index.html;
        }

        # Proxy para o backend Spring Boot dentro do docker-compose
        location /api/ {    
	    # Define o DNS interno do Docker para o Nginx consultar
            resolver 127.0.0.11 valid=30s;
    
            # Colocamos a URL em uma vari�vel para for�ar a re-resolu��o do DNS
            set $backend_api http://api-transporte:8080;
		        
            proxy_pass $backend_api;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';

	    # Adicione estas linhas para evitar o "Connection Refused"
    	    proxy_next_upstream error timeout http_500 http_502 http_503 http_504;    	    
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_cache_bypass $http_upgrad;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}