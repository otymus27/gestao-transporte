user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Opcional: Melhora a velocidade de carregamento do Angular
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name _;

        # ✅ Mantido o limite de 50M (essencial para uploads de arquivos)
        client_max_body_size 50M;

        root /usr/share/nginx/html;
        index index.html index.htm;

        location / {
            # ✅ Essencial para rotas do Angular (evita erro 404 ao dar F5)
            try_files $uri $uri/ /index.html;
        }

        # Proxy para o backend Spring Boot dentro do docker-compose
        location /api/ {
            # ✅ AJUSTE: Use a porta interna 8080. 
            # A barra no final de http://api:8080/ remove o prefixo "/api" antes de enviar ao Java.
            proxy_pass http://api:8080/;           
          
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}