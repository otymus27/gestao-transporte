# Nome da aplicacao
spring.application.name=${APP_NAME}

# Porta e endereco
server.port=${SERVER_PORT}
server.address=0.0.0.0

# JWT
jwt.secret=${JWT_SECRET}

# Banco de dados
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&useLegacyDatetimeCode=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${SHOW_SQL:false}

# Logs (producao deve ser mais limpo)
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.springframework.beans.factory.support.DefaultListableBeanFactory=${BEAN_LOG_LEVEL:INFO}

# Seguranca extra
spring.main.allow-circular-references=false

# Recursos web
spring.web.resources.add-mappings=false

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

net.sf.jasperreports.compiler.class=net.sf.jasperreports.engine.design.JRJdtCompiler

