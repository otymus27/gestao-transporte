# Nome da aplicação
spring.application.name=${APP_NAME:sistema}

# Porta configurável (default 8083)
server.port=${SERVER_PORT:8080}

# Backend precisa aceitar conexões de fora do container
server.address=0.0.0.0

# Chave secreta para gerar o token JWT
jwt.secret=${JWT_SECRET:MySuperSecretKeyForJWTThatIsLongEnoughForTestingOnly12345}

# Configuração do banco de dados
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_nutran}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:otymus27}
spring.datasource.password=${DB_PASSWORD:admin271@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${SHOW_SQL:true}

# Logs
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:DEBUG}
logging.level.org.springframework.beans.factory.support.DefaultListableBeanFactory=${BEAN_LOG_LEVEL:DEBUG}

# Circular references (segurança extra)
spring.main.allow-circular-references=false

# Recursos web
spring.web.resources.add-mappings=false

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
