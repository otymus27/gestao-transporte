# Nome da aplicacao
spring.application.name=sistema

# Porta configuravel (default 8083)
server.port=8080

# Backend precisa aceitar conexoes de fora do container
server.address=0.0.0.0

#Chave secreta para gerar o token
jwt.secret=MySuperSecretKeyForJWTThatIsLongEnoughForTestingOnly12345


# Configuracao do banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/db_nutran?createDatabaseIfNotExist=true&useSSl=false&serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Logs
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.beans.factory.support.DefaultListableBeanFactory=DEBUG

#Para visualizar log mais profundos
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework=TRACE

# Circular references (seguranca extra)
spring.main.allow-circular-references=false

# Recursos web
spring.web.resources.add-mappings=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
